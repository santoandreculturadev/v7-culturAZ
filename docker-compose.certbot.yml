services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    volumes:
      - ./docker-data/certs/conf:/etc/letsencrypt
      - ./docker-data/certs/www:/usr/share/nginx/html/
    ports:
      - "80:80"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./docker-data/certs/conf:/etc/letsencrypt
      - ./docker-data/certs/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --noninteractive --agree-tos; sleep 12h & wait $${!}; done;'"
